<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Email шаблон</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4">
    <!-- Зовнішня таблиця-обгортка -->
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <!-- Основний контейнер -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="background-color: #ffffff"
          >
            <!-- Хедер -->
            <tr>
              <td
                style="
                  background-color: #3371a5;
                  padding: 20px;
                  text-align: center;
                "
              >
                <h1
                  style="
                    color: #ffffff;
                    font-family: Arial, sans-serif;
                    font-size: 24px;
                    margin: 0;
                  "
                >
                  Назва компанії
                </h1>
              </td>
            </tr>
            <!-- Контент -->
            <tr>
              <td
                style="
                  padding: 30px;
                  font-family: Arial, sans-serif;
                  font-size: 16px;
                  color: #333333;
                "
              >
                <p>Привіт! Це тестовий email-шаблон.</p>
                <img
                  src="https://www.imgonline.com.ua/examples/bee-on-daisy-mini.jpg"
                  alt="Банер акції"
                  width="540"
                  style="display: block"
                />
              </td>
            </tr>
            <!-- Футер -->
            <tr>
              <td
                style="
                  padding: 20px;
                  text-align: center;
                  font-family: Arial, sans-serif;
                  font-size: 12px;
                  color: #999999;
                "
              >
                <a href="#" style="color: #999999">Відписатися</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
