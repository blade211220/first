<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/section1.css" />
    <link rel="stylesheet" href="css/normalize.css" />
  </head>
  <body>
    <nav class="navigation-container container">
      <img src="картинки/Logo.png" alt="лого" />
      <div class="nav-items-container">
        <span class="active-item">Home</span>
        <span>Shop</span>
        <span>Plant Care</span>
        <span>Blogs</span>
      </div>
      <button
        class="login-button"
        type="button"
        onclick="window.open('registration form.html', '_blank')"
      >
        Login
      </button>
    </nav>
    <section>
      <div class="hero-container">
        <div class="hero-left-side">
          <div class="text-container">
            <h5 class="hero-title">welcome to greenshop</h5>
            <h1 class="hero-h1">
              LET'S MAKE A <br />BETTER
              <span class="primary-color">PLANET</span>
            </h1>
            <p class="hero-paragraph">
              We are an online plant shop offering a wide range of cheap and
              trendy plants. Use <br />
              our plants to create an unique Urban Jungle. Order your favoutite
              plants!
            </p>
          </div>
          <button
            class="shop-button"
            type="button"
            onclick="window.open('catalog.html', '_blank')"
          >
            SHOP NOW
          </button>
        </div>
        <img class="image" src="картинки/Frame 1.png" alt="рослина" />
      </div>
    </section>
  </body>
</html>
