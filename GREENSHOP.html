<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=500px, height=656px, initial-scale=1.0"
    />
    <title>Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 style="text-align: center">
      Login | <span class="clr">Register</span>
    </h1>
    <p style="text-align: center">Enter your email and password to register.</p>
    <form style="text-align: center">
      <input
        class="input_dsgn"
        type="text"
        id="username"
        placeholder="Username"
        required
      />
      <br />
      <input
        class="input_dsgn"
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      />
      <br />
      <input
        class="input_dsgn"
        type="password"
        id="password"
        placeholder="Password"
        required
      />
      <br />
      <input
        class="input_dsgn"
        type="password"
        id="confirm-password"
        placeholder="Confirm your password"
        required
      />
      <br />
      <button class="bt" type="submit">Register</button>
      <br />
      Or register with
      <br />
      <button class="social_media">
        <img
          src="https://1drv.ms/i/c/3a3d64fc42cd5667/IQBjM1hlDtevTptjAJsxDdxeAdTS3j4kpDUsFGVeip1Wzsk?e=xpazor"
          alt="Google"
        />
        <span>Continue with Google</span>
      </button>
      </br>
      <button class="social_media">
        <img
          src="https://1drv.ms/i/c/3a3d64fc42cd5667/IQBZ42E8tavGSqSLKCCDAicsAZOx9X0TJLwsQBb5ikrzQY8?e=ILL0m5"
          alt="Facebook"
        />
        <span>Continue with Facebook</span>
      </button>
    </form>
  </body>
</html>
