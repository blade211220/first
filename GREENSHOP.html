<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2 style="text-align: center">
      Login | <span class="clr">Register</span>
    </h2>
    <p class="enter">Enter your email and password to register.</p>
    <form style="text-align: center">
      <input
        class="input_dsgn"
        type="text"
        id="username"
        placeholder="Username"
        required
      />
      <br />
      <input
        class="input_dsgn"
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      />
      <br />
      <input
        class="input_dsgn"
        type="password"
        id="password"
        placeholder="Password"
        required
      />
      <br />
      <input
        class="input_dsgn"
        type="password"
        id="confirm-password"
        placeholder="Confirm your password"
        required
      />
      <br />
      <button class="bt" type="submit">Register</button>
    </br>
     <p style="margin:10px;">Or register with</p>
    </br>
      <button 
      class="social_media"
      type="button">
        <img
          src="google.jpg.jpg"
          alt="Google"
        />
        <span>Continue with Google</span>
      </button>
      </br>
      <button 
      class="social_media" 
      type="button">
        <img
          src="facebook.jpg.jpg"
          alt="Facebook"
        />
        <span>Continue with Facebook</span>
      </button>
    </form>
    <div class="green"></div>
  </body>
</html>
